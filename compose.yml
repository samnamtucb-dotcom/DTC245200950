services:

  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: restaurant-app

    ports:
      - "8000:8000"

    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}

    depends_on:
      db:
        condition: service_healthy

    networks:
      - frontend
      - backend

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s


  db:
    image: postgres:16-alpine

    container_name: restaurant-db

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - backend

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


  pgadmin:
    image: dpage/pgadmin4:latest

    container_name: restaurant-pgadmin

    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}

    ports:
      - "5050:80"

    depends_on:
      db:
        condition: service_healthy

    networks:
      - backend

    restart: unless-stopped


  nginx:
    image: nginx:1.27-alpine

    container_name: restaurant-nginx

    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      app:
        condition: service_healthy

    networks:
      - frontend

    restart: unless-stopped


  prometheus:
    image: prom/prometheus:latest

    container_name: restaurant-prometheus

    ports:
      - "9090:9090"

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    depends_on:
      app:
        condition: service_healthy

    networks:
      - frontend

    restart: unless-stopped


  grafana:
    image: grafana/grafana:latest

    container_name: restaurant-grafana

    ports:
      - "3000:3000"

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}

    volumes:
      - grafana_data:/var/lib/grafana

    depends_on:
      - prometheus
      - loki

    networks:
      - frontend

    restart: unless-stopped


  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest

    container_name: restaurant-postgres-exporter

    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable"

    depends_on:
      db:
        condition: service_healthy

    networks:
      - backend
      - frontend

    restart: unless-stopped


  loki:
    image: grafana/loki:latest

    container_name: restaurant-loki

    command: -config.file=/etc/loki/local-config.yaml

    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki

    networks:
      - frontend

    restart: unless-stopped


  promtail:
    image: grafana/promtail:latest

    container_name: restaurant-promtail

    command: -config.file=/etc/promtail/config.yml

    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

    depends_on:
      - loki

    networks:
      - frontend

    restart: unless-stopped


volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  loki_data:


networks:
  frontend:
    driver: bridge

  backend:
    driver: bridge
    internal: true