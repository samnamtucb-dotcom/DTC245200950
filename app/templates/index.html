<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Restaurant Management</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #1f2937;
        }

        header {
            background: #1f2937;
            color: white;
            padding: 18px 40px;
        }

        header h2 {
            margin: 0;
        }

        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .welcome {
            background: white;
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 25px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .08);
        }

        .number {
            font-size: 32px;
            font-weight: bold;
            margin-top: 10px;
        }

        .status {
            margin-top: 30px;
            background: #dcfce7;
            color: #166534;
            padding: 15px 20px;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <header>
        <h2>🍽 Restaurant Management System</h2>
    </header>

    <div class="container">

        <div class="welcome">
            <h1>Dashboard</h1>
            <p>Hệ thống quản lý nhà hàng và đơn hàng.</p>
        </div>

        <div class="grid">

            <div class="card">
                <div>Món ăn</div>
                <div class="number">{{ stats.menu_items }}</div>
            </div>

            <div class="card">
                <div>Bàn ăn</div>
                <div class="number">{{ stats.tables }}</div>
            </div>

            <div class="card">
                <div>Đơn hàng</div>
                <div class="number">{{ stats.orders }}</div>
            </div>

            <div class="card">
                <div>Nhân viên</div>
                <div class="number">{{ stats.employees }}</div>
            </div>

        </div>

        <div class="status">
            ● Hệ thống đang hoạt động bình thường
        </div>

    </div>

</body>

</html>
