global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

scrape_configs:

  - job_name: "prometheus"
    static_configs:
      - targets:
          - "localhost:9090"
        labels:
          service: "monitoring"

  - job_name: "restaurant-app"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "app:8000"
        labels:
          service: "fastapi"

  - job_name: "postgres"
    static_configs:
      - targets:
          - "postgres-exporter:9187"
        labels:
          service: "database"